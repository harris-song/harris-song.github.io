<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeling Lucky - AI Generated Page</title>
    <!-- Always include jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --accent-color: #06b6d4;
            --dark-color: #0f172a;
            --light-color: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Animated particles background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 48px;
            box-shadow:
                0 32px 64px rgba(0, 0, 0, 0.12),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 900px;
            width: 95%;
            text-align: center;
            position: relative;
            overflow: hidden;
            z-index: 1;
            transform: perspective(1000px) rotateX(2deg);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.1) 0%,
                    rgba(255, 255, 255, 0.05) 50%,
                    rgba(255, 255, 255, 0.1) 100%);
            border-radius: 24px;
            pointer-events: none;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            position: relative;
            z-index: 2;
        }

        .spinner-container {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary-color);
            border-right: 3px solid var(--secondary-color);
            border-bottom: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .spinner::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: spinReverse 3s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        @keyframes spinReverse {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(-360deg);
            }
        }

        .loading-text {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textPulse 2s ease-in-out infinite;
        }

        @keyframes textPulse {

            0%,
            100% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
            }
        }

        .loading-steps {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
        }

        .step {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            animation: stepPulse 1.5s ease-in-out infinite;
        }

        .step:nth-child(2) {
            animation-delay: 0.2s;
        }

        .step:nth-child(3) {
            animation-delay: 0.4s;
        }

        .step:nth-child(4) {
            animation-delay: 0.6s;
        }

        .step:nth-child(5) {
            animation-delay: 0.8s;
        }

        @keyframes stepPulse {

            0%,
            100% {
                background: rgba(255, 255, 255, 0.3);
                transform: scale(1);
            }

            50% {
                background: rgba(255, 255, 255, 0.8);
                transform: scale(1.5);
            }
        }

        .error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(220, 38, 38, 0.1));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 32px;
            border-radius: 16px;
            margin: 24px 0;
            position: relative;
            z-index: 2;
        }

        .retry-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.4);
        }

        .retry-btn:active {
            transform: translateY(0);
        }

        #ai-content {
            width: 100%;
            min-height: 300px;
            position: relative;
            z-index: 2;
        }

        .header {
            margin-bottom: 40px;
            position: relative;
            z-index: 2;
        }

        .header h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            color: #fff;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.8) 50%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: -0.02em;
            animation: titleFloat 3s ease-in-out infinite;
        }

        @keyframes titleFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.25rem;
            font-weight: 400;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        .magic-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 18px 36px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            margin-top: 32px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
            z-index: 2;
        }

        .magic-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.4);
        }

        .magic-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .magic-btn:hover::before {
            left: 100%;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .container {
                padding: 32px 24px;
                margin: 16px;
                width: calc(100% - 32px);
            }

            .header h1 {
                font-size: 2.5rem;
            }

            .header p {
                font-size: 1.1rem;
            }

            .spinner-container {
                width: 100px;
                height: 100px;
            }

            .spinner {
                width: 70px;
                height: 70px;
            }
        }

        /* Content transition styles */
        .fade-in {
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <!-- Particles background -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="header">
            <h1>Portfolio Generator</h1>
            <p>Experience sophisticated AI-generated portfolio designs. Each generation creates a unique, professional
                experience crafted with cutting-edge web technologies.</p>
            <button class="magic-btn" onclick="location.reload()">Generate New Design</button>
        </div>

        <div id="ai-content">
            <div class="loading">
                <div class="spinner-container">
                    <div class="spinner"></div>
                </div>
                <div class="loading-text">Crafting your unique experience...</div>
                <div class="loading-steps">
                    <div class="step"></div>
                    <div class="step"></div>
                    <div class="step"></div>
                    <div class="step"></div>
                    <div class="step"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Create animated particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                const size = Math.random() * 4 + 2;
                const startX = Math.random() * window.innerWidth;
                const duration = Math.random() * 20 + 10;
                const delay = Math.random() * 5;

                particle.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    left: ${startX}px;
                    animation: floatUp ${duration}s ${delay}s infinite linear;
                `;

                particlesContainer.appendChild(particle);
            }
        }

        // Add particle animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes floatUp {
                0% {
                    transform: translateY(100vh) rotate(0deg);
                    opacity: 0;
                }
                10% {
                    opacity: 1;
                }
                90% {
                    opacity: 1;
                }
                100% {
                    transform: translateY(-100px) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Initialize particles
        createParticles();
        const API_URL = 'https://harris-song-github-io.vercel.app/api/generate-page';
        const contentDiv = document.getElementById('ai-content');

        // Loading messages to cycle through
        const loadingMessages = [
            "Initializing GPT-4 design engine...",
            "AI is crafting your professional portfolio...",
            "Generating sophisticated layouts...",
            "Implementing advanced interactions...",
            "Finalizing your portfolio..."
        ];

        let messageIndex = 0;
        let loadingInterval;

        function updateLoadingMessage() {
            const loadingText = document.querySelector('.loading-text');
            if (loadingText) {
                loadingText.textContent = loadingMessages[messageIndex];
                messageIndex = (messageIndex + 1) % loadingMessages.length;
            }
        }

        async function generatePage() {
            try {
                // Start loading message cycle
                loadingInterval = setInterval(updateLoadingMessage, 2000);

                console.log('Calling GPT-4 API:', API_URL);
                console.log('Forcing unique generation with timestamp:', Date.now());

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        timestamp: Date.now(),
                        uniqueId: Math.random().toString(36).substring(7),
                        forceNew: true,
                        style: 'revolutionary-portfolio',
                        theme: 'award-winning-innovation',
                        creativity: 'maximum-chaos'
                    })
                });

                console.log('API Response status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error:', response.status, errorText);
                    throw new Error(`GPT API failed! Status: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                console.log('GPT Generated content received!', {
                    timestamp: data.timestamp,
                    source: data.source,
                    hasHtml: !!data.html,
                    debugInfo: data.debugInfo
                });

                // Log debug info for analysis
                if (data.debugInfo) {
                    console.log('🎨 Style Selection Debug:', data.debugInfo);
                }

                // Save HTML to console for manual inspection
                console.log('📄 Generated HTML Preview:', data.html.substring(0, 500) + '...');

                // Clear loading interval
                clearInterval(loadingInterval);

                if (data.html && data.html.trim()) {
                    console.log('Replacing content with GPT generation...');

                    // Add fade out animation to loading
                    contentDiv.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                    contentDiv.style.opacity = '0';
                    contentDiv.style.transform = 'translateY(-30px) scale(0.95)';

                    setTimeout(() => {
                        // Extract and clean body content
                        let bodyContent = data.html;

                        // If it's a full HTML document, extract body content
                        const bodyMatch = bodyContent.match(/<body[^>]*>([\s\S]*)<\/body>/i);
                        if (bodyMatch) {
                            bodyContent = bodyMatch[1];
                        }

                        // Replace the content with smooth transition
                        document.body.innerHTML = bodyContent;
                        document.body.style.opacity = '0';
                        document.body.style.transform = 'translateY(20px)';

                        // Create debug download link for HTML inspection
                        const debugBlob = new Blob([`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Generated Portfolio</title></head><body>${bodyContent}</body></html>`], { type: 'text/html' });
                        const debugUrl = URL.createObjectURL(debugBlob);
                        console.log('🔍 Download generated HTML for inspection:', debugUrl);

                        // Add debug info to window for inspection
                        window.lastGeneratedHTML = bodyContent;
                        window.lastDebugInfo = data.debugInfo;

                        // Animate in the new content
                        setTimeout(() => {
                            document.body.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
                            document.body.style.opacity = '1';
                            document.body.style.transform = 'translateY(0)';
                        }, 100);

                        // Execute any scripts in the new content
                        setTimeout(() => {
                            const scripts = document.querySelectorAll('script');
                            scripts.forEach((script, index) => {
                                try {
                                    if (script.src && !script.src.includes('jquery') && !script.src.includes('gsap')) {
                                        const newScript = document.createElement('script');
                                        newScript.src = script.src;
                                        newScript.onload = () => console.log(`Loaded: ${script.src}`);
                                        newScript.onerror = () => console.error(`Failed: ${script.src}`);
                                        document.head.appendChild(newScript);
                                    } else if (!script.src && script.textContent.trim()) {
                                        try {
                                            new Function(script.textContent)();
                                            console.log(`Executed inline script ${index}`);
                                        } catch (error) {
                                            console.error(`Script execution error:`, error);
                                        }
                                    }
                                } catch (error) {
                                    console.error(`Error processing script ${index}:`, error);
                                }
                            });
                        }, 400);

                    }, 600);
                } else {
                    console.error('No HTML content in response:', data);
                    throw new Error('GPT returned empty content!');
                }
            } catch (error) {
                console.error('CRITICAL ERROR - GPT generation failed:', error);
                clearInterval(loadingInterval);

                // Show error and force retry
                contentDiv.innerHTML = `
                    <div style="background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(220, 38, 38, 0.1)); backdrop-filter: blur(10px); border: 1px solid rgba(239, 68, 68, 0.2); color: #ef4444; padding: 40px; border-radius: 20px; margin: 30px 0; text-align: center; position: relative; z-index: 2;">
                        <h3 style="margin-bottom: 20px; font-size: 1.5rem;">Generation Failed</h3>
                        <p style="margin-bottom: 20px; opacity: 0.9; line-height: 1.6;">The AI couldn't generate your portfolio right now. Let's try again.</p>
                        <p style="font-size: 0.9rem; opacity: 0.7; margin-bottom: 30px;">Error: ${error.message}</p>
                        <button style="background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; padding: 16px 32px; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; transition: all 0.3s ease;" onclick="location.reload()">
                            Retry Generation
                        </button>
                    </div>
                `;
            }
        }

        // Generate page on load with a slight delay for effect
        setTimeout(() => {
            generatePage();
        }, 1000);

        // Add refresh functionality
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                location.reload();
            }
        });

        // Add floating hint after delay
        setTimeout(() => {
            const hint = document.createElement('div');
            hint.style.cssText = `
                position: fixed;
                bottom: 30px;
                right: 30px;
                background: rgba(0,0,0,0.8);
                color: white;
                padding: 16px 24px;
                border-radius: 30px;
                font-size: 14px;
                font-weight: 500;
                opacity: 0;
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 1000;
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.1);
                box-shadow: 0 8px 32px rgba(0,0,0,0.3);
                cursor: pointer;
            `;
            hint.innerHTML = 'Click for New Design';
            hint.onclick = () => location.reload();
            document.body.appendChild(hint);

            // Animate in
            setTimeout(() => {
                hint.style.opacity = '0.9';
                hint.style.transform = 'translateY(-10px)';
            }, 100);

        }, 2000);

        // Add keyboard shortcuts for testing
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                location.reload();
            }
            if (e.key === 'r' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                location.reload();
            }
        });
    </script>
</body>

</html>
